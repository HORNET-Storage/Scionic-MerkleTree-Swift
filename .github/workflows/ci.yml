name: CI

# The checks that are run locally before a commit, on Linux, macOS and
# Windows: the full test suite, built for testing and built for use. Each
# system hashes with something of its own: swift-crypto on Linux, CryptoKit on
# macOS, and CNG on Windows. The tests hold the library to the vectors under
# spec/, and to the forged bytes that it has to refuse.

on:
  push:
    branches: [main, hardening]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Swift 6.3.1
        run: |
          curl -fsSL --retry 3 -o /tmp/swift.tar.gz https://download.swift.org/swift-6.3.1-release/ubuntu2404/swift-6.3.1-RELEASE/swift-6.3.1-RELEASE-ubuntu24.04.tar.gz
          mkdir -p "$HOME/swift"
          tar -xzf /tmp/swift.tar.gz -C "$HOME/swift" --strip-components=1
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
      - run: swift --version
      - run: swift test
      - run: swift test -c release -Xswiftc -enable-testing

  macos:
    name: macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift test
      - run: swift test -c release -Xswiftc -enable-testing
      # iOS has no runner of its own. The library is built for it here, with
      # the same hashing as on macOS.
      - run: xcodebuild build -scheme ScionicMerkleTree -destination 'generic/platform=iOS' -quiet

  windows:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3.1-release
          swift-build: 6.3.1-RELEASE
      - run: swift --version
      - run: swift test
      - run: swift test -c release -Xswiftc -enable-testing

  oldest:
    name: the oldest Swift the package names
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Swift 6.0
        run: |
          curl -fsSL --retry 3 -o /tmp/swift.tar.gz https://download.swift.org/swift-6.0.3-release/ubuntu2404/swift-6.0.3-RELEASE/swift-6.0.3-RELEASE-ubuntu24.04.tar.gz
          mkdir -p "$HOME/swift"
          tar -xzf /tmp/swift.tar.gz -C "$HOME/swift" --strip-components=1
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
      - run: swift --version
      - run: swift test
